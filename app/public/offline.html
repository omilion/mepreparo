<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071426" />
    <title>MePreparo — Sin conexión</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f8fafc;
        background: #071426;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 430px);
        padding: 32px;
        border: 1px solid #233653;
        border-radius: 24px;
        text-align: center;
        background: #0c1d35;
        box-shadow: 0 20px 60px rgb(0 0 0 / 30%);
      }
      img { width: 72px; height: 72px; }
      h1 { margin: 20px 0 10px; font-size: 1.65rem; }
      p { margin: 0; color: #cbd5e1; line-height: 1.55; }
      button {
        margin-top: 24px;
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        color: #071426;
        background: #67e8f9;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Te quedaste sin conexión</h1>
      <p>Tu cuenta y tu avance siguen guardados. Conéctate a internet para continuar con Rai.</p>
      <button type="button" onclick="location.reload()">Intentar de nuevo</button>
    </main>
  </body>
</html>
